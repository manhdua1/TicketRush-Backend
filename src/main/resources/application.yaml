spring:
  application:
    name: ticketrush-backend

  datasource:
    url: jdbc:mysql://localhost:3306/ticket_rush?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

jwt:
  secret: c0015e35ed778f66e55716f375879ebc69c06e356760f7a6c7fb69494b6dab25
  expiration: 604800000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

otp:
  expiration: 120 # 2 phút

demo-data:
  ticketbox-events:
    enabled: ${DEMO_TICKETBOX_EVENTS_ENABLED:true}

# Cấu hình hàng chờ ảo
queue:
  threshold: 10         # Số user đồng thời để kích hoạt hàng chờ (set thấp để test)
  batch-size: 10       # Số người được grant mỗi lượt
  granted-ttl: 10      # TTL quyền đặt vé (phút)
  token-cookie-ttl: 60 # TTL cookie queue token (phút)
  active-user-ttl: 60  # TTL session active user (giây)

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
